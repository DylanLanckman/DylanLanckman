name: Build Android APK

on:
  push:
    branches:
      - claude/debate-academy-app-J1cao
    paths:
      - 'debate-app/**'
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: debate-app/package-lock.json

      - name: Install dependencies
        working-directory: debate-app
        run: npm ci

      - name: Build web app
        working-directory: debate-app
        run: npm run build

      - name: Sync Capacitor assets
        working-directory: debate-app
        run: npx cap sync android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('debate-app/android/**/*.gradle*', 'debate-app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make Gradle wrapper executable
        working-directory: debate-app/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: debate-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debat-academie-debug
          path: debate-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
